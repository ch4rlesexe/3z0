<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 3Z0 Blog</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Login to your 3Z0 Blog account to access your profile, create posts, and interact with the community.">
    <meta name="keywords" content="login, 3Z0 blog, user account, authentication">
    <meta name="author" content="3Z0 Blog">
    <meta name="robots" content="noindex, nofollow">
    <meta name="language" content="English">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://3z0.org/login">
    <meta property="og:title" content="Login - 3Z0 Blog">
    <meta property="og:description" content="Login to your 3Z0 Blog account">
    <meta property="og:site_name" content="3Z0 Blog">
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:url" content="https://3z0.org/login">
    <meta name="twitter:title" content="Login - 3Z0 Blog">
    <meta name="twitter:description" content="Login to your 3Z0 Blog account">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/nobg.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/nobg.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/nobg.png">
    <link rel="apple-touch-icon" href="/assets/nobg.png">
    
    <!-- Prevent flash -->
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="auth-logo">
                    <i class="fas fa-home"></i>
                    <span>3Z0 Blog</span>
                </a>
                <h1>Welcome Back</h1>
                <p>Sign in to your account to continue</p>
            </div>
            
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="password-toggle" data-input="password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                    <a href="/forgot-password.html" class="forgot-link">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loading">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>
                
                <div class="auth-divider">
                    <span>or</span>
                </div>
                
                <div class="social-auth">
                    <button type="button" class="btn btn-social btn-google">
                        <i class="fab fa-google"></i>
                        Continue with Google
                    </button>
                    <button type="button" class="btn btn-social btn-github">
                        <i class="fab fa-github"></i>
                        Continue with GitHub
                    </button>
                </div>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="/signup.html">Sign up</a></p>
            </div>
        </div>
        
        <div class="auth-background">
            <div class="auth-illustration">
                <i class="fas fa-user-circle"></i>
            </div>
        </div>
    </div>
    
    <!-- Theme Toggle -->
    <button class="theme-toggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
    </button>
    
    <script src="/js/theme.js"></script>
    <script src="/js/auth.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.getElementById('login-form');
        const submitBtn = loginForm.querySelector('button[type="submit"]');
        const btnText = submitBtn.querySelector('.btn-text');
        const btnLoading = submitBtn.querySelector('.btn-loading');
        
        // Handle form submission
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('error');
            
            // Disable submit button and show loading
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing In...';
            errorDiv.textContent = '';
            
            try {
                const result = await authManager.login(email, password);
                
                if (result.success) {
                    // Check if there's a redirect URL
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectUrl = urlParams.get('redirect');
                    
                    if (redirectUrl) {
                        window.location.href = redirectUrl;
                    } else {
                        // Check if user is admin and redirect accordingly
                        const isAdmin = await authManager.checkAdminPermissions();
                        if (isAdmin) {
                            window.location.href = '/admin';
                        } else {
                            window.location.href = '/';
                        }
                    }
                } else {
                    errorDiv.textContent = result.message || 'Login failed';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'An error occurred during login';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
        
        // Password toggle functionality
        const passwordToggles = document.querySelectorAll('.password-toggle');
        passwordToggles.forEach(toggle => {
            toggle.addEventListener('click', function() {
                const inputId = this.getAttribute('data-input');
                const input = document.getElementById(inputId);
                const icon = this.querySelector('i');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'fas fa-eye-slash';
                } else {
                    input.type = 'password';
                    icon.className = 'fas fa-eye';
                }
            });
        });
        
        // Social auth buttons (placeholder for future implementation)
        const googleBtn = document.querySelector('.btn-google');
        const githubBtn = document.querySelector('.btn-github');
        
        if (googleBtn) {
            googleBtn.addEventListener('click', function() {
                alert('Google authentication will be implemented soon.');
            });
        }
        
        if (githubBtn) {
            githubBtn.addEventListener('click', function() {
                alert('GitHub authentication will be implemented soon.');
            });
        }
    });
    </script>
</body>
</html>
