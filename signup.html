<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - 3Z0 Blog</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Create your 3Z0 Blog account to start sharing your thoughts, creating posts, and joining the community.">
    <meta name="keywords" content="signup, register, 3Z0 blog, create account, join community">
    <meta name="author" content="3Z0 Blog">
    <meta name="robots" content="noindex, nofollow">
    <meta name="language" content="English">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://3z0.org/signup">
    <meta property="og:title" content="Sign Up - 3Z0 Blog">
    <meta property="og:description" content="Create your 3Z0 Blog account">
    <meta property="og:site_name" content="3Z0 Blog">
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:url" content="https://3z0.org/signup">
    <meta name="twitter:title" content="Sign Up - 3Z0 Blog">
    <meta name="twitter:description" content="Create your 3Z0 Blog account">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/nobg.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/nobg.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/nobg.png">
    <link rel="apple-touch-icon" href="/assets/nobg.png">
    
    <!-- Prevent flash -->
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="auth-logo">
                    <i class="fas fa-home"></i>
                    <span>3Z0 Blog</span>
                </a>
                <h1>Create Account</h1>
                <p>Join our community and start sharing your thoughts</p>
            </div>
            
            <form id="signup-form" class="auth-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="first_name" name="first_name" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="last_name" name="last_name" required>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-group">
                        <i class="fas fa-at"></i>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <small class="form-help">This will be your unique identifier on the platform</small>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="password-toggle" data-input="password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <small class="form-help">Must be at least 8 characters long</small>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                        <button type="button" class="password-toggle" data-input="confirm_password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span class="checkmark"></span>
                        I agree to the <a href="/terms.html" target="_blank">Terms of Service</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <span class="checkmark"></span>
                        Subscribe to our newsletter for updates
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">
                    <span class="btn-text">Create Account</span>
                    <span class="btn-loading">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>
                
                <div class="auth-divider">
                    <span>or</span>
                </div>
                
                <div class="social-auth">
                    <button type="button" class="btn btn-social btn-google">
                        <i class="fab fa-google"></i>
                        Sign up with Google
                    </button>
                    <button type="button" class="btn btn-social btn-github">
                        <i class="fab fa-github"></i>
                        Sign up with GitHub
                    </button>
                </div>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="/login.html">Sign in</a></p>
            </div>
        </div>
        
        <div class="auth-background">
            <div class="auth-illustration">
                <i class="fas fa-user-plus"></i>
            </div>
        </div>
    </div>
    
    <!-- Theme Toggle -->
    <button class="theme-toggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
    </button>
    
    <script src="/js/theme.js"></script>
    <script src="/js/auth.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const signupForm = document.getElementById('signup-form');
        const submitBtn = signupForm.querySelector('button[type="submit"]');
        const btnText = submitBtn.querySelector('.btn-text');
        const btnLoading = submitBtn.querySelector('.btn-loading');
        
        // Handle form submission
        signupForm.addEventListener('submit', async function(e) {
            e.preventDefault(); // Prevent default form submission
            
            const formData = {
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value,
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                confirm_password: document.getElementById('confirm_password').value,
                terms: document.getElementById('terms').checked,
                newsletter: document.getElementById('newsletter').checked
            };
            
            // Client-side validation
            if (formData.password !== formData.confirm_password) {
                alert('Passwords do not match');
                return;
            }
            
            if (formData.password.length < 8) {
                alert('Password must be at least 8 characters long');
                return;
            }
            
            if (!formData.terms) {
                alert('You must agree to the Terms of Service and Privacy Policy');
                return;
            }
            
            // Show loading state
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline-block';
            
            try {
                // Use the authManager to handle registration
                await authManager.register(formData);
                
                // Redirect to home page or intended destination
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect') || '/';
                window.location.href = redirect;
                
            } catch (error) {
                console.error('Signup error:', error);
                alert('Registration failed. Please check your information and try again.');
                
                // Reset loading state
                submitBtn.disabled = false;
                btnText.style.display = 'inline-block';
                btnLoading.style.display = 'none';
            }
        });
        
        // Password toggle functionality
        const passwordToggles = document.querySelectorAll('.password-toggle');
        passwordToggles.forEach(toggle => {
            toggle.addEventListener('click', function() {
                const inputId = this.getAttribute('data-input');
                const input = document.getElementById(inputId);
                const icon = this.querySelector('i');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'fas fa-eye-slash';
                } else {
                    input.type = 'password';
                    icon.className = 'fas fa-eye';
                }
            });
        });
        
        // Password confirmation validation
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm_password');
        
        function validatePasswordMatch() {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            if (confirmPassword && password !== confirmPassword) {
                confirmPasswordInput.setCustomValidity('Passwords do not match');
            } else {
                confirmPasswordInput.setCustomValidity('');
            }
        }
        
        passwordInput.addEventListener('input', validatePasswordMatch);
        confirmPasswordInput.addEventListener('input', validatePasswordMatch);
        
        // Social auth buttons (placeholder for future implementation)
        const googleBtn = document.querySelector('.btn-google');
        const githubBtn = document.querySelector('.btn-github');
        
        if (googleBtn) {
            googleBtn.addEventListener('click', function() {
                alert('Google authentication will be implemented soon.');
            });
        }
        
        if (githubBtn) {
            githubBtn.addEventListener('click', function() {
                alert('GitHub authentication will be implemented soon.');
            });
        }
    });
    </script>
</body>
</html>
